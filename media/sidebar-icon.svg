<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CodeGraph">
  <!-- Monochrome graph glyph echoing the chat icon's node/edge layout. Uses currentColor so
       VS Code tints it with the active/inactive Activity Bar foreground. -->
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <line x1="6" y1="6" x2="13" y2="5"/>
    <line x1="6" y1="6" x2="6" y2="15"/>
    <line x1="13" y1="5" x2="18" y2="11"/>
    <line x1="13" y1="5" x2="6" y2="15"/>
    <line x1="18" y1="11" x2="14" y2="18"/>
    <line x1="6" y1="15" x2="14" y2="18"/>
  </g>
  <g fill="currentColor">
    <circle cx="6" cy="6" r="2"/>
    <circle cx="18" cy="11" r="1.8"/>
    <circle cx="6" cy="15" r="1.8"/>
    <circle cx="14" cy="18" r="1.8"/>
    <!-- hub / "god node", slightly larger to match the highlighted node in the chat icon -->
    <circle cx="13" cy="5" r="2.7"/>
  </g>
</svg>
