<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graphweft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="40" y1="60" x2="220" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56d364"/>
      <stop offset="1" stop-color="#4f9cf9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop stop-color="#4f9cf9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f9cf9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="118" r="96" fill="url(#glow)"/>

  <!-- edges -->
  <g stroke="url(#edge)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="76" y1="76" x2="150" y2="64"/>
    <line x1="76" y1="76" x2="70" y2="158"/>
    <line x1="150" y1="64" x2="196" y2="120"/>
    <line x1="150" y1="64" x2="70" y2="158"/>
    <line x1="196" y1="120" x2="158" y2="186"/>
    <line x1="70" y1="158" x2="158" y2="186"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="76" cy="76" r="18" fill="#4f9cf9"/>
    <circle cx="196" cy="120" r="16" fill="#56d364"/>
    <circle cx="70" cy="158" r="15" fill="#56d364"/>
    <circle cx="158" cy="186" r="16" fill="#4f9cf9"/>
    <!-- god node, highlighted -->
    <circle cx="150" cy="64" r="22" fill="#facc15"/>
    <circle cx="150" cy="64" r="22" fill="none" stroke="#0d1117" stroke-width="3"/>
  </g>

  <!-- privacy lock badge -->
  <g transform="translate(150,150)">
    <circle cx="32" cy="32" r="34" fill="#0d1117" stroke="#56d364" stroke-width="4"/>
    <rect x="18" y="30" width="28" height="22" rx="4" fill="#56d364"/>
    <path d="M23 30 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#56d364" stroke-width="4"/>
    <circle cx="32" cy="40" r="3.5" fill="#0d1117"/>
  </g>
</svg>
